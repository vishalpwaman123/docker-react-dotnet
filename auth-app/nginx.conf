server{

    listen 80;

    # Docker's built-in DNS server, available on any user-defined network.
    # Needed because we resolve the API's name while requests run, not at
    # startup: putting the address in a variable below stops nginx from
    # refusing to boot when the auth-api container is not up yet.
    resolver 127.0.0.11 valid=10s;

    # /api/ goes to the auth-api container. "auth-api" is the container
    # name; Docker DNS on a user-defined network resolves it.
    # No trailing slash after 8080, so /api/auth/signup passes through intact.
    location /api/ {
        set $auth_api http://auth-api:8080;
        proxy_pass $auth_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is React. try_files lets React Router own /signin, /signup.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

}